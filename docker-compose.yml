services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      TASTEGRAPH_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      # Enable auth by mapping api-keys to tenants (JSON). Omit for dev mode.
      # TASTEGRAPH_API_KEYS: '{"key_a":"tenant_a"}'
      TASTEGRAPH_RATE_PER_MIN: "120"
      TASTEGRAPH_QUOTA_PER_DAY: "100000"
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
