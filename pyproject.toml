[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tastebench"
version = "0.1.0"
description = "Open-source infrastructure for evaluating subjective AI judgment via pairwise preference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "TasteBench contributors" }]
keywords = ["evaluation", "llm", "preference", "benchmark", "subjective", "judge"]
dependencies = [
    "pydantic>=2",
    "litellm>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
hf = ["datasets>=2"]
embeddings = ["sentence-transformers>=2", "scikit-learn>=1.1", "numpy>=1.21"]
train = ["torch>=2", "transformers>=4.30", "peft>=0.7", "trl>=0.7", "numpy>=1.21"]
web = ["fastapi>=0.100", "uvicorn>=0.20", "jinja2>=3"]
scrape = ["httpx>=0.24", "beautifulsoup4>=4.10"]
tastegraph = ["numpy>=1.21"]
vectordb = ["qdrant-client>=1.7"]
av = ["av>=11", "faster-whisper>=1"]
dev = ["pytest>=7"]

[project.scripts]
tastebench = "tastebench.cli:main"

[project.urls]
Homepage = "https://github.com/tastebench/tastebench"

[tool.hatch.build.targets.wheel]
packages = ["tastebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
